name = "cardingx-blog"
main = "worker.js"
compatibility_date = "2026-10-02"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin*"]

[[d1_databases]]
binding = "DB"
database_name = "carding_blog_db"
database_id = "da5c72f9-16bd-4518-a250-d780af17dbd5"

